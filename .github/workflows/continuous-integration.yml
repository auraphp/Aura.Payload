name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '5.6'
          - '7.0'
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:2.2
          ini-values: assert.exception=1, zend.assertions=1

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-lock --no-check-publish

      # No lock file is committed, so this resolves the highest PHPUnit the
      # running PHP version can take; the Yoast polyfills paper over the API
      # differences between PHPUnit 4.8 and 12.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Report the resolved PHPUnit version
        run: ./vendor/bin/phpunit --version

      - name: Run test suite
        run: ./vendor/bin/phpunit

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2
          ini-values: assert.exception=1, zend.assertions=1

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # The filter cannot live in phpunit.xml.dist: PHPUnit 9 and below spell
      # it <filter><whitelist>, PHPUnit 10 and up <source>, and the same file
      # has to parse on every version in the matrix above.
      - name: Run test suite with coverage
        run: php -d xdebug.mode=coverage ./vendor/bin/phpunit --coverage-filter=src --coverage-clover=coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
